name: Pipeline tests

on:
  push:
    branches: [main, dev, mansur_orazkhan]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run synthetic pipeline and export tests
        run: uv run --locked python -m unittest discover -s tests -v
